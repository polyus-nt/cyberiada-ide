name: Build Release manually (Seafile upload)

on:
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest

    env:
      RELEASE_SKIP_WINDOWS: '1'
      RELEASE_SEAFILE_STAGING: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --checkout --recursive

      - name: Build release image
        run: docker compose -f compose.release.yml build release

      - name: Build Linux artifacts
        run: docker compose -f compose.release.yml run --rm release

      - name: Upload to Seafile
        uses: chekoopa/upload-to-seafile@v1
        with:
          server-url: ${{ secrets.SEAFILE_SERVER_URL }}
          username: ${{ secrets.SEAFILE_USERNAME }}
          password: ${{ secrets.SEAFILE_PASSWORD }}
          repo-id: ${{ secrets.SEAFILE_REPO_ID }}
          remote-path: '/'
          # remote-path: /${{ env.date }}
          local-path: 'outputs/seafile-upload/*'
          overwrite: 'true'

      - name: Save deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-build
          path: |
            dist/*.deb

      - name: Save snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-build
          path: |
            dist/*.snap

      - name: Save AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-build
          path: |
            dist/*.AppImage

  windows-build:
    runs-on: ubuntu-latest
    env:
      RELEASE_SKIP_LINUX: '1'
      RELEASE_SKIP_WINDOWS: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker 29.4.2's seccomp profile breaks Wine socket calls.
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: v29.9.3
      - name: Show Docker version
        run: docker version

      - name: Init submodules
        run: git submodule update --init --checkout --recursive
      - name: Build release image
        run: docker compose -f compose.release.yml build release
      - name: Check Wine before downloading Windows toolchains
        run: docker compose -f compose.release.yml run --rm --no-deps release winepath -w /project
      - name: Build Windows artifacts
        run: RELEASE_SEAFILE_STAGING=1 docker compose -f compose.release.yml run --rm release

      - name: Upload to Seafile
        uses: chekoopa/upload-to-seafile@v1
        with:
          server-url: ${{ secrets.SEAFILE_SERVER_URL }}
          username: ${{ secrets.SEAFILE_USERNAME }}
          password: ${{ secrets.SEAFILE_PASSWORD }}
          repo-id: ${{ secrets.SEAFILE_REPO_ID }}
          remote-path: '/'
          # remote-path: /${{ env.date }}
          local-path: 'outputs/seafile-upload/*'
          overwrite: 'true'

      - name: Save exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-build
          path: |
            dist/*.exe

      - name: Save windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-build
          path: |
            outputs/cyberiada-*-windows.zip

  mac-build:
    runs-on: macos-latest

    needs: [linux-build, windows-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: npm ci
      - name: Check macOS module packaging and repair script
        run: node --test build/test-macos-packaging.cjs
      - run: npm run build
      - run: npm run bundle:mac
        env:
          USE_HARD_LINKS: 'false'

      - name: Save dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-build
          if-no-files-found: error
          path: dist/*.dmg

      - name: Upload to Seafile
        uses: chekoopa/upload-to-seafile@v1
        with:
          server-url: ${{ secrets.SEAFILE_SERVER_URL }}
          username: ${{ secrets.SEAFILE_USERNAME }}
          password: ${{ secrets.SEAFILE_PASSWORD }}
          repo-id: ${{ secrets.SEAFILE_REPO_ID }}
          remote-path: '/'
          local-path: 'dist/*.dmg'
          overwrite: 'true'
